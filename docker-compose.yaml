services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Keep the model resident — cold loads on this hardware exceed proxy timeouts.
      - OLLAMA_KEEP_ALIVE=24h
    # GPU is optional; Qwen2.5-3B / Phi-3 run on CPU (slower). To use an NVIDIA GPU,
    # install the NVIDIA Container Toolkit and uncomment the block below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=builder
    volumes:
      - builder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d builder"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-builder:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:1.5b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/builder
      - REDIS_URL=redis://cache:6379/0
      - BUILD_CACHE_TTL=${BUILD_CACHE_TTL:-3600}
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  ollama_models:
  builder_pgdata:
